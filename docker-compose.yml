services:
  vitoria-ai:
    build:
      context: ./services/vitoria-ai
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      VITORIA_HOST: 0.0.0.0
      VITORIA_PORT: 8100
      VITORIA_API_KEY: dev-vitoria-key-change-me
      VITORIA_ENV: development
      # OPENAI_API_KEY: sk-...
    restart: unless-stopped
