name: Setup PLATFORM_OWNER (server)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente (production | clinicaunio)'
        required: true
        default: production
        type: choice
        options:
          - production
          - clinicaunio
      email:
        description: 'E-mail da conta owner'
        required: false
        default: joabe@uniowork.com.br
      password:
        description: 'Senha (deixe vazio para gerar automaticamente)'
        required: false
        default: ''

jobs:
  setup-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}

    env:
      DEPLOY_SSH_ALIAS: hg-deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH HostGator
        uses: ./.github/actions/hostgator-ssh
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh_host: ${{ secrets.DEPLOY_SSH_HOST }}
          ssh_user: ${{ secrets.DEPLOY_SSH_USER }}
          ssh_port: ${{ secrets.DEPLOY_SSH_PORT }}
          canonical_host: ${{ vars.DEPLOY_SSH_CANONICAL_HOST }}

      - name: Criar ou atualizar PLATFORM_OWNER
        id: owner
        env:
          DEPLOY_PATH: ${{ inputs.environment == 'clinicaunio' && '/home2/joabef36/unio-clinicaunio' || '/home2/joabef36/unio' }}
          OWNER_EMAIL: ${{ inputs.email }}
          INPUT_PASSWORD: ${{ inputs.password }}
          SECRET_PASSWORD: ${{ secrets.PLATFORM_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          OWNER_PASSWORD="${INPUT_PASSWORD:-${SECRET_PASSWORD:-}}"
          if [[ -z "${OWNER_PASSWORD}" ]]; then
            OWNER_PASSWORD="$(openssl rand -base64 18 | tr -d '/+=' | head -c 14)"
          fi
          echo "::add-mask::${OWNER_PASSWORD}"
          bash scripts/ci-retry.sh ssh "${DEPLOY_SSH_ALIAS}" \
            "cd '${DEPLOY_PATH}' && php bin/console app:ensure-platform-owner \
              --allow-prod \
              --email='${OWNER_EMAIL}' \
              --password='${OWNER_PASSWORD}' \
              --no-interaction && \
             php bin/console cache:clear --env=prod --no-warmup && \
             php bin/console cache:warmup --env=prod"
          {
            echo "email=${OWNER_EMAIL}"
            echo "password=${OWNER_PASSWORD}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Conta PLATFORM_OWNER"
            echo "- **Ambiente:** ${{ inputs.environment }}"
            echo "- **E-mail:** ${OWNER_EMAIL}"
            echo "- **Senha:** \`${OWNER_PASSWORD}\`"
            echo ""
            echo "Troque a senha após o primeiro login."
          } >> "$GITHUB_STEP_SUMMARY"
