name: Setup PLATFORM_OWNER (server)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente (production | clinicaunio)'
        required: true
        default: production
        type: choice
        options:
          - production
          - clinicaunio
      email:
        description: 'E-mail da conta owner'
        required: false
        default: joabe@uniowork.com.br

jobs:
  setup-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}

    env:
      DEPLOY_SSH_ALIAS: hg-deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH HostGator
        uses: ./.github/actions/hostgator-ssh
        with:
          ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh_host: ${{ secrets.DEPLOY_SSH_HOST }}
          ssh_user: ${{ secrets.DEPLOY_SSH_USER }}
          ssh_port: ${{ secrets.DEPLOY_SSH_PORT }}
          canonical_host: ${{ vars.DEPLOY_SSH_CANONICAL_HOST }}

      - name: Criar ou atualizar PLATFORM_OWNER
        env:
          DEPLOY_PATH: ${{ inputs.environment == 'clinicaunio' && '/home2/joabef36/unio-clinicaunio' || '/home2/joabef36/unio' }}
          OWNER_EMAIL: ${{ inputs.email }}
          OWNER_PASSWORD: ${{ secrets.PLATFORM_OWNER_PASSWORD }}
        run: |
          if [[ -z "${OWNER_PASSWORD}" ]]; then
            echo "::error::Defina o secret PLATFORM_OWNER_PASSWORD no environment ${{ inputs.environment }}"
            exit 1
          fi
          bash scripts/ci-retry.sh ssh "${DEPLOY_SSH_ALIAS}" \
            "cd '${DEPLOY_PATH}' && php bin/console app:ensure-platform-owner \
              --allow-prod \
              --email='${OWNER_EMAIL}' \
              --password='${OWNER_PASSWORD}' \
              --no-interaction && \
             php bin/console cache:clear --env=prod --no-warmup && \
             php bin/console cache:warmup --env=prod"
