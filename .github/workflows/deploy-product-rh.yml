name: Deploy Product RH

on:
  workflow_dispatch:
  # Deploy automatico pausado — reativar push em product/rh quando voltar ao ar.
  # push:
  #   branches:
  #     - product/rh

concurrency:
  group: deploy-product-rh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate-reusable.yml
    with:
      git_branch: product/rh

  deploy:
    needs: validate
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      github_environment: product-rh
      deploy_path_default: /home2/joabef36/unio-rh
      deploy_public_html_default: /home2/joabef36/rh.uniowork.com.br
      archive_remote_name: deploy-rh.tar.gz
      skip_unio_platform_steps: false
      report_artifact_prefix: deploy-report-rh
      failure_summary_title: Falha no deploy RH
    secrets: inherit

  smoke_test:
    needs: deploy
    uses: ./.github/workflows/smoke-test-reusable.yml
    with:
      urls: |
        https://rh.uniowork.com.br/login
