name: CI

on:
  push:
    branches:
      - main
      - production
      - new_staging
      - new_staging2
      - 'feature/**'
      - 'product/**'
  pull_request:
    branches:
      - main
      - production
      - new_staging
      - new_staging2
      - 'product/**'

env:
  APP_ENV: dev
  APP_SECRET: ci-secret-not-for-production
  DATABASE_URL: mysql://root:root@127.0.0.1:3306/unio?serverVersion=mariadb-10.11.11&charset=utf8mb4

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: unio
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, pdo_mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Validate (lint, seeds, PHPStan, PHPUnit, assets)
        run: composer validate:ci
        env:
          GIT_BRANCH: ${{ github.ref_name }}
