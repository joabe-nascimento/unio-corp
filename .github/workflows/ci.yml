name: CI

# CI em push: branches oficiais (sem product/rh — validate roda no workflow Deploy Product RH).
# product/** e feature/** validam via PR.
on:
  push:
    branches:
      - main
      - production
      - new_staging
      - new_staging2
  pull_request:
    branches:
      - main
      - production
      - new_staging
      - new_staging2
      - 'product/**'
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate-reusable.yml
    with:
      git_branch: ${{ github.ref_name }}
