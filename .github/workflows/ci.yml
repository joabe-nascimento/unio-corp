name: CI

# CI em push: branches oficiais (sem product/rh e uniosaude — validate roda no workflow Deploy dedicado).
# product/** e feature/** validam via PR.
# Cron diário (06:00 UTC = 03:00 BRT) — detecta quebras sem push recente.
on:
  push:
    branches:
      - main
      - production
      - new_staging
      - new_staging2
  pull_request:
    branches:
      - main
      - production
      - new_staging
      - new_staging2
      - 'product/**'
      - 'feature/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**/*.md'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate-reusable.yml
    with:
      git_branch: ${{ github.ref_name }}
