name: CI

on:
  push:
    branches:
      - main
      - production
      - new_staging
      - new_staging2
      - 'feature/**'
      - 'product/**'
  pull_request:
    branches:
      - main
      - production
      - new_staging
      - new_staging2
      - 'product/**'

env:
  APP_ENV: dev
  APP_SECRET: ci-secret-not-for-production
  DATABASE_URL: mysql://root:root@127.0.0.1:3306/unio?serverVersion=mariadb-10.11.11&charset=utf8mb4

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: unio
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, pdo_mysql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare database
        run: |
          # Banco vazio no CI: migrations incrementais não criam user/empresa (schema legado).
          # schema:create gera todas as tabelas a partir das entidades Doctrine.
          php bin/console doctrine:database:drop --force --if-exists --no-interaction
          php bin/console doctrine:database:create --no-interaction
          php bin/console doctrine:schema:create --no-interaction
          php bin/console app:seed-users --no-interaction
          php bin/console app:seed-product-grants --force --no-interaction

      - name: Validate system rules
        run: composer validate:system

      - name: Run PHPUnit
        run: composer test
        env:
          APP_ENV: test
