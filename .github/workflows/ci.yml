name: CI

# CI só em push para branches “oficiais”. product/** e feature/** validam via PR
# (evita dezenas de runs idênticos ao sincronizar branches espelho).
on:
  push:
    branches:
      - main
      - production
      - new_staging
      - new_staging2
  pull_request:
    branches:
      - main
      - production
      - new_staging
      - new_staging2
      - 'product/**'
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate-reusable.yml
    with:
      git_branch: ${{ github.ref_name }}
