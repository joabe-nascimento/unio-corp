# Deploy reutilizavel — HostGator via SSH.
# Secrets SSH no repositorio (Settings -> Secrets). Variaveis de path no GitHub Environment.

name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      github_environment:
        required: true
        type: string
      deploy_path_default:
        required: true
        type: string
      deploy_public_html_default:
        required: true
        type: string
      archive_remote_name:
        required: false
        type: string
        default: deploy.tar.gz
      skip_unio_platform_steps:
        required: false
        type: boolean
        default: false
      report_artifact_prefix:
        required: false
        type: string
        default: deploy-report
      failure_summary_title:
        required: false
        type: string
        default: Falha no deploy
    secrets:
      DEPLOY_SSH_HOST:
        required: true
      DEPLOY_SSH_USER:
        required: true
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_SSH_PORT:
        required: true
      MAILBOX_JOABE_PASSWORD:
        required: false
      MAILBOX_UNIO_PASSWORD:
        required: false
      PLATFORM_OWNER_PASSWORD:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.github_environment }}

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_CANONICAL_HOST: ${{ vars.DEPLOY_SSH_CANONICAL_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PUBLIC_HTML: ${{ vars.DEPLOY_PUBLIC_HTML }}
      ARCHIVE_REMOTE: ${{ inputs.archive_remote_name }}
      DEPLOY_SSH_ALIAS: hg-deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          bash scripts/ci-ssh-setup.sh

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, mbstring, pdo_mysql, zip
          coverage: none

      - name: Install Composer dependencies (prod)
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader --no-scripts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Sync public vendor assets
        run: |
          npm ci
          npm run vendor:sync
          php bin/minify-css.php

      - name: Create and upload deploy archive
        run: |
          ARCHIVE="${RUNNER_TEMP}/deploy.tar.gz"
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='var/cache' \
              --exclude='var/log' \
              --exclude='public/uploads' \
              --exclude='tests' \
              --exclude='docs' \
              --exclude='services' \
              --exclude='.cursor' \
              --exclude='deploy.tar.gz' \
              --exclude='phpunit.xml.dist' \
              --exclude='.phpunit.cache' \
              -czf "$ARCHIVE" .

          bash scripts/ci-retry.sh scp "$ARCHIVE" "${DEPLOY_SSH_ALIAS}:/tmp/${ARCHIVE_REMOTE}"

      - name: Extract and post-deploy on server
        timeout-minutes: 12
        env:
          MAILBOX_JOABE_PASSWORD: ${{ secrets.MAILBOX_JOABE_PASSWORD }}
          MAILBOX_UNIO_PASSWORD: ${{ secrets.MAILBOX_UNIO_PASSWORD }}
          PLATFORM_OWNER_PASSWORD: ${{ secrets.PLATFORM_OWNER_PASSWORD }}
        run: |
          DEPLOY_PATH="${DEPLOY_PATH:-${{ inputs.deploy_path_default }}}"
          PUBLIC_HTML="${DEPLOY_PUBLIC_HTML:-${{ inputs.deploy_public_html_default }}}"
          ARCHIVE="${ARCHIVE_REMOTE}"

          ENV_FILE="${RUNNER_TEMP}/deploy-remote.env"
          {
            printf 'DEPLOY_PATH=%s\n' "$DEPLOY_PATH"
            printf 'PUBLIC_HTML=%s\n' "$PUBLIC_HTML"
            printf 'GITHUB_SHA=%s\n' '${{ github.sha }}'
            printf 'GITHUB_REF_NAME=%s\n' '${{ github.ref_name }}'
            if [[ "${{ inputs.skip_unio_platform_steps }}" == "true" ]]; then
              printf 'SKIP_UNIO_PLATFORM_STEPS=1\n'
            else
              printf 'MAILBOX_JOABE_PASSWORD=%s\n' "${MAILBOX_JOABE_PASSWORD:-}"
              printf 'MAILBOX_UNIO_PASSWORD=%s\n' "${MAILBOX_UNIO_PASSWORD:-}"
              printf 'PLATFORM_OWNER_PASSWORD=%s\n' "${PLATFORM_OWNER_PASSWORD:-}"
            fi
          } > "$ENV_FILE"

          bash scripts/ci-retry.sh scp "$ENV_FILE" "${DEPLOY_SSH_ALIAS}:/tmp/deploy-remote.env"
          bash scripts/ci-retry.sh scp scripts/ci-remote-extract.sh "${DEPLOY_SSH_ALIAS}:/tmp/ci-remote-extract.sh"
          bash scripts/ci-retry.sh ssh "${DEPLOY_SSH_ALIAS}" "ARCHIVE=${ARCHIVE} bash /tmp/ci-remote-extract.sh"

      - name: Baixar relatorio de deploy (sucesso ou falha)
        if: always() && (success() || failure())
        continue-on-error: true
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || inputs.deploy_path_default }}
        run: |
          mkdir -p deploy-reports
          scp "${DEPLOY_SSH_ALIAS}:${DEPLOY_PATH}/var/log/deploy-report.txt" \
              deploy-reports/deploy-report.txt 2>/dev/null \
            || echo "Relatorio remoto indisponivel" > deploy-reports/deploy-report.txt

      - name: Upload relatorio de deploy
        if: always() && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.report_artifact_prefix }}-${{ github.run_id }}
          path: deploy-reports/deploy-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Resumo de falha do deploy
        if: failure()
        run: |
          if [[ -f deploy-reports/deploy-report.txt ]]; then
            {
              echo "## ${{ inputs.failure_summary_title }}"
              echo '```text'
              cat deploy-reports/deploy-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
