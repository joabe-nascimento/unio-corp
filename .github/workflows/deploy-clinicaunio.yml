name: Deploy Clinica Unio

on:
  push:
    branches:
      - clinicaunio
  workflow_dispatch:

concurrency:
  group: deploy-clinicaunio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate-reusable.yml
    with:
      git_branch: clinicaunio

  deploy:
    needs: validate
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      github_environment: clinicaunio
      deploy_path_default: /home2/joabef36/unio-clinicaunio
      deploy_public_html_default: /home2/joabef36/clinicaunio.uniowork.com.br
      archive_remote_name: deploy-clinicaunio.tar.gz
      skip_unio_platform_steps: false
      report_artifact_prefix: deploy-report-clinicaunio
      failure_summary_title: Falha no deploy Clinica Unio
    secrets: inherit

  smoke_test:
    needs: deploy
    uses: ./.github/workflows/smoke-test-hostgator-reusable.yml
    with:
      default_uri: https://clinicaunio.uniowork.com.br
      paths: |
        /
        /login
    secrets: inherit
