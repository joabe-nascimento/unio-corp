name: Deploy Production

on:
  push:
    branches:
      - production

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, mbstring, pdo_mysql, zip
          coverage: none

      - name: Install Composer dependencies (prod)
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Sync public vendor assets
        run: |
          npm ci
          npm run vendor:sync

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          DEPLOY_PORT="${{ secrets.DEPLOY_SSH_PORT }}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          ssh-keyscan -p "$DEPLOY_PORT" "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync to HostGator
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_PATH="${DEPLOY_PATH:-/home2/joabef36/unio}"
          RSYNC_SSH="ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT} -o StrictHostKeyChecking=accept-new"
          rsync -avz \
            -e "$RSYNC_SSH" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'var/cache/' \
            --exclude 'var/log/' \
            --exclude 'public/uploads/' \
            --exclude 'tests/' \
            --exclude 'docs/' \
            --exclude 'services/' \
            --exclude '.cursor/' \
            --exclude '*.zip' \
            --exclude 'phpunit.xml.dist' \
            --exclude '.phpunit.cache/' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Post-deploy (migrations, cache, public_html)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            export DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"
            export PUBLIC_HTML="${{ vars.DEPLOY_PUBLIC_HTML }}"
            export DEPLOY_PATH="${DEPLOY_PATH:-/home2/joabef36/unio}"
            export PUBLIC_HTML="${PUBLIC_HTML:-/home2/joabef36/public_html}"
            export PHP_BIN="${PHP_BIN:-php}"
            bash "${DEPLOY_PATH}/scripts/deploy-server.sh"
