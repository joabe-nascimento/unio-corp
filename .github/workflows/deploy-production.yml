name: Deploy Production

on:
  push:
    branches:
      - production

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, mbstring, pdo_mysql, zip
          coverage: none

      - name: Install Composer dependencies (prod)
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader --no-scripts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Sync public vendor assets
        run: |
          npm ci
          npm run vendor:sync

      - name: Create deploy archive
        run: |
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='var/cache' \
              --exclude='var/log' \
              --exclude='public/uploads' \
              --exclude='tests' \
              --exclude='docs' \
              --exclude='services' \
              --exclude='.cursor' \
              --exclude='*.zip' \
              --exclude='*.tar.gz' \
              --exclude='phpunit.xml.dist' \
              --exclude='.phpunit.cache' \
              -czf deploy.tar.gz .

      - name: Upload archive to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          source: deploy.tar.gz
          target: /tmp/
          strip_components: 0

      - name: Extract and post-deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-/home2/joabef36/unio}"
            PUBLIC_HTML="${{ vars.DEPLOY_PUBLIC_HTML }}"
            PUBLIC_HTML="${PUBLIC_HTML:-/home2/joabef36/public_html}"

            mkdir -p "$DEPLOY_PATH"
            tar -xzf /tmp/deploy.tar.gz -C "$DEPLOY_PATH"
            rm -f /tmp/deploy.tar.gz

            export DEPLOY_PATH PUBLIC_HTML
            export PHP_BIN="${PHP_BIN:-php}"
            bash "${DEPLOY_PATH}/scripts/deploy-server.sh"
