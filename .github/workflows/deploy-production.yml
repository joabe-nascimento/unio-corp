name: Deploy Production

on:
  workflow_dispatch:
  # Deploy automatico pausado — reativar push em production quando voltar ao ar.
  # push:
  #   branches:
  #     - production

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate-reusable.yml
    with:
      git_branch: production

  deploy:
    needs: validate
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      github_environment: production
      deploy_path_default: /home2/joabef36/unio
      deploy_public_html_default: /home2/joabef36/public_html
      skip_unio_platform_steps: false
      report_artifact_prefix: deploy-report
      failure_summary_title: Falha no deploy
    secrets: inherit

  smoke_test:
    needs: deploy
    uses: ./.github/workflows/smoke-test-reusable.yml
    with:
      urls: |
        https://uniowork.com.br/
        https://uniowork.com.br/login
        https://uniowork.com.br/termos
        https://uniowork.com.br/privacidade

  release:
    needs: smoke_test
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-${{ github.run_number }}
          name: Deploy production #${{ github.run_number }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
