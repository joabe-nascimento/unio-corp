name: Deploy Production

on:
  push:
    branches:
      - production

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate-reusable.yml
    with:
      git_branch: production

  deploy:
    needs: validate
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      github_environment: production
      deploy_path_default: /home2/joabef36/unio
      deploy_public_html_default: /home2/joabef36/public_html
      skip_unio_platform_steps: false
      report_artifact_prefix: deploy-report
      failure_summary_title: Falha no deploy
    secrets: inherit
