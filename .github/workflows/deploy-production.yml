name: Deploy Production

on:
  push:
    branches:
      - production

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: unio
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: dev
      APP_SECRET: ci-secret-not-for-production
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/unio?serverVersion=mariadb-10.11.11&charset=utf8mb4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, pdo_mysql
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Validate before deploy
        run: composer validate:ci
        env:
          GIT_BRANCH: production

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PUBLIC_HTML: ${{ vars.DEPLOY_PUBLIC_HTML }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ctype, iconv, mbstring, pdo_mysql, zip
          coverage: none

      - name: Install Composer dependencies (prod)
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader --no-scripts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Sync public vendor assets
        run: |
          npm ci
          npm run vendor:sync

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "Chave SSH inválida — verifique DEPLOY_SSH_KEY no GitHub"; exit 1; }
          ssh-keyscan -p "${DEPLOY_PORT:-2222}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create and upload deploy archive
        run: |
          ARCHIVE="${RUNNER_TEMP}/deploy.tar.gz"
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='.env' \
              --exclude='.env.*' \
              --exclude='var/cache' \
              --exclude='var/log' \
              --exclude='public/uploads' \
              --exclude='tests' \
              --exclude='docs' \
              --exclude='services' \
              --exclude='.cursor' \
              --exclude='deploy.tar.gz' \
              --exclude='phpunit.xml.dist' \
              --exclude='.phpunit.cache' \
              -czf "$ARCHIVE" .

          scp -i ~/.ssh/deploy_key \
              -P "${DEPLOY_PORT:-2222}" \
              -o StrictHostKeyChecking=accept-new \
              -o BatchMode=yes \
              "$ARCHIVE" \
              "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/deploy.tar.gz"

      - name: Extract and post-deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script: |
            DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-/home2/joabef36/unio}"
            PUBLIC_HTML="${{ vars.DEPLOY_PUBLIC_HTML }}"
            PUBLIC_HTML="${PUBLIC_HTML:-/home2/joabef36/public_html}"

            mkdir -p "$DEPLOY_PATH"
            tar -xzf /tmp/deploy.tar.gz -C "$DEPLOY_PATH"
            rm -f /tmp/deploy.tar.gz

            export DEPLOY_PATH PUBLIC_HTML
            export PHP_BIN="${PHP_BIN:-php}"
            bash "${DEPLOY_PATH}/scripts/deploy-server.sh"
