# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.mailer_from: '%env(MAILER_FROM_ADDRESS)%'
    app.default_user_password_default: 'unio123'
    env(APP_DEFAULT_USER_PASSWORD): ''
    sasha_ai_url_default: ''
    sasha_ai_key_default: 'dev-sasha-key-change-me'
    sasha_ai_enabled_default: 'true'
    legal_ai_url_default: 'http://127.0.0.1:8090'
    legal_ai_enabled_default: 'false'
    legal_ai_escritorio_id_default: 'default'
    azure_tenant_id_default: ''
    azure_client_id_default: ''
    azure_client_secret_default: ''
    azure_openai_resource_id_default: ''
    default_uri_default: 'http://127.0.0.1:8000'
    mercure_url_default: 'http://localhost:3000/.well-known/mercure'
    mercure_jwt_default: '!ChangeMe!UnioMercureJwtDevSecret32!'
    app.chat_mercure_topic_base_default: 'https://localhost/chat'
    app.pos_op_mercure_topic_base_default: 'https://localhost/pos-operatorio'
    env(WHATSAPP_PROVIDER): ''
    env(WHATSAPP_META_TOKEN): ''
    env(WHATSAPP_META_PHONE_NUMBER_ID): ''
    env(WHATSAPP_META_GRAPH_VERSION): 'v21.0'
    env(WHATSAPP_META_TEMPLATE_AGENDA): ''
    env(WHATSAPP_META_TEMPLATE_QUESTIONARIO): ''
    env(WHATSAPP_META_TEMPLATE_LANG): 'pt_BR'
    env(WHATSAPP_META_VERIFY_TOKEN): ''
    env(WHATSAPP_META_APP_SECRET): ''
    env(WHATSAPP_META_EMPRESA_CNPJ): ''
    env(WHATSAPP_META_TENANT_MAP): '{}'
    env(ASAAS_API_KEY): ''
    env(ASAAS_API_KEYS_JSON): '{}'
    env(ASAAS_WEBHOOK_TOKEN): ''
    whatsapp_provider_default: ''
    whatsapp_meta_token_default: ''
    whatsapp_meta_phone_number_id_default: ''
    whatsapp_meta_graph_version_default: 'v21.0'
    whatsapp_meta_template_agenda_default: ''
    whatsapp_meta_template_questionario_default: ''
    whatsapp_meta_template_lang_default: 'pt_BR'
    whatsapp_meta_verify_token_default: ''
    whatsapp_meta_app_secret_default: ''
    whatsapp_meta_empresa_cnpj_default: ''
    whatsapp_meta_tenant_map_default: '{}'
    asaas_api_key_default: ''
    asaas_api_keys_json_default: '{}'
    asaas_webhook_token_default: ''

    wallet_apple_pass_type_id_default: ''
    wallet_apple_team_id_default: ''
    wallet_apple_cert_path_default: ''
    wallet_apple_cert_password_default: ''
    wallet_apple_wwdr_path_default: 'config/wallet/AppleWWDRCAG4.pem'
    wallet_google_issuer_id_default: ''
    wallet_google_service_account_path_default: ''
    wallet_google_origins_default: ''
    
    # JWT Configuration
    env(JWT_SECRET_KEY): 'your-super-secret-jwt-key-change-this-in-production-minimum-32-chars'
    jwt_secret_key_default: 'dev-jwt-secret-key-please-change-in-production-32chars'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Service/PosOperatorio/Whatsapp/MetaCloudWhatsappSender.php'
            - '../src/Service/PosOperatorio/Whatsapp/NoopWhatsappSender.php'

    App\Service\PasswordResetService:
        arguments:
            $mailerFrom: '%app.mailer_from%'
            $mailerDsn: '%env(MAILER_DSN)%'
            $kernelDebug: '%kernel.debug%'

    App\Service\PlatformConfigService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\FuncionarioService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Juridico\JuridicoDocumentoService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Command\GenerateUniojuridicoDocumentoCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\UserProfileService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\RhDocumentService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ChatService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ChatMercureTopics:
        arguments:
            $topicBase: '%env(default:app.chat_mercure_topic_base_default:MERCURE_CHAT_TOPIC_BASE)%'

    App\Service\PosOperatorio\PosOperatorioMercureTopics:
        arguments:
            $topicBase: '%env(default:app.pos_op_mercure_topic_base_default:POS_OP_MERCURE_TOPIC_BASE)%'

    App\Service\PosOperatorio\ClinicConfigStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\PosOperatorio\ClinicPatientNotifier:
        arguments:
            $mailerFrom: '%app.mailer_from%'

    App\Service\PosOperatorio\ClinicAgendaConfirmToken:
        arguments:
            $appSecret: '%kernel.secret%'

    App\Service\PosOperatorio\Whatsapp\WhatsappMetaTenantResolver:
        arguments:
            $metaPhoneNumberId: '%env(default:whatsapp_meta_phone_number_id_default:WHATSAPP_META_PHONE_NUMBER_ID)%'
            $metaEmpresaCnpj: '%env(default:whatsapp_meta_empresa_cnpj_default:WHATSAPP_META_EMPRESA_CNPJ)%'
            $metaTenantMapJson: '%env(default:whatsapp_meta_tenant_map_default:WHATSAPP_META_TENANT_MAP)%'

    App\Controller\Api\WhatsappMetaWebhookController:
        arguments:
            $verifyToken: '%env(default:whatsapp_meta_verify_token_default:WHATSAPP_META_VERIFY_TOKEN)%'
            $appSecret: '%env(default:whatsapp_meta_app_secret_default:WHATSAPP_META_APP_SECRET)%'

    App\Controller\Api\AsaasWebhookController:
        arguments:
            $webhookToken: '%env(default:asaas_webhook_token_default:ASAAS_WEBHOOK_TOKEN)%'

    App\Service\PosOperatorio\Whatsapp\ClinicWhatsappSenderFactory:
        arguments:
            $provider: '%env(default:whatsapp_provider_default:WHATSAPP_PROVIDER)%'
            $metaToken: '%env(default:whatsapp_meta_token_default:WHATSAPP_META_TOKEN)%'
            $metaPhoneNumberId: '%env(default:whatsapp_meta_phone_number_id_default:WHATSAPP_META_PHONE_NUMBER_ID)%'
            $metaGraphVersion: '%env(default:whatsapp_meta_graph_version_default:WHATSAPP_META_GRAPH_VERSION)%'
            $templateAgenda: '%env(default:whatsapp_meta_template_agenda_default:WHATSAPP_META_TEMPLATE_AGENDA)%'
            $templateQuestionario: '%env(default:whatsapp_meta_template_questionario_default:WHATSAPP_META_TEMPLATE_QUESTIONARIO)%'
            $templateLang: '%env(default:whatsapp_meta_template_lang_default:WHATSAPP_META_TEMPLATE_LANG)%'

    App\Service\PosOperatorio\Whatsapp\ClinicWhatsappSenderInterface:
        factory: ['@App\Service\PosOperatorio\Whatsapp\ClinicWhatsappSenderFactory', 'create']

    App\Service\PosOperatorio\ClinicIntegrationConfigService:
        arguments:
            $asaasApiKey: '%env(default:asaas_api_key_default:ASAAS_API_KEY)%'
            $asaasApiKeysJson: '%env(default:asaas_api_keys_json_default:ASAAS_API_KEYS_JSON)%'

    App\Service\PosOperatorio\ClinicProductConfigService:
        arguments: {}

    App\Service\PosOperatorio\ClinicGuiaMedicoService:
        arguments: {}

    App\Service\PosOperatorio\ClinicCarteirinhaService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Wallet\ClinicWalletConfig:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $applePassTypeId: '%env(default:wallet_apple_pass_type_id_default:WALLET_APPLE_PASS_TYPE_ID)%'
            $appleTeamId: '%env(default:wallet_apple_team_id_default:WALLET_APPLE_TEAM_ID)%'
            $appleCertPath: '%env(default:wallet_apple_cert_path_default:WALLET_APPLE_CERT_PATH)%'
