            $appleWwdrPath: '%env(default:wallet_apple_wwdr_path_default:WALLET_APPLE_WWDR_PATH)%'
            $googleIssuerId: '%env(default:wallet_google_issuer_id_default:WALLET_GOOGLE_ISSUER_ID)%'
            $googleServiceAccountPath: '%env(default:wallet_google_service_account_path_default:WALLET_GOOGLE_SERVICE_ACCOUNT_PATH)%'
            $googleOrigins: '%env(default:wallet_google_origins_default:WALLET_GOOGLE_ORIGINS)%'

    App\Service\Wallet\ClinicWalletTokenService:
        arguments:
            $kernelSecret: '%kernel.secret%'

    App\Service\Ti\TiChamadoAttachmentService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Rh\RhCandidatoAttachmentService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Rh\RhRecrutamentoEmailService:
        arguments:
            $mailerFrom: '%app.mailer_from%'

    App\Service\Marketing\StudioModuleEngagementStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\LgpdRequestMailer:
        arguments:
            $mailerFrom: '%app.mailer_from%'

    App\Controller\Module\Admin\AdminController:
        arguments:
            $passwordHasher: '@security.user_password_hasher'

    App\Service\Sasha\SashaClient:
        arguments:
            $enabled: '%env(bool:default:sasha_ai_enabled_default:SASHA_AI_ENABLED)%'
            $baseUrl: '%env(default:sasha_ai_url_default:SASHA_AI_URL)%'
            $apiKey: '%env(default:sasha_ai_key_default:SASHA_AI_KEY)%'

    App\Service\Juridico\JurisFlowAiClient:
