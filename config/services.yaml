# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.mailer_from: '%env(MAILER_FROM_ADDRESS)%'
    vitoria_ai_url_default: ''
    vitoria_ai_key_default: 'dev-vitoria-key-change-me'
    vitoria_ai_enabled_default: 'true'
    default_uri_default: 'http://127.0.0.1:8000'
    mercure_url_default: 'http://localhost:3000/.well-known/mercure'
    mercure_jwt_default: '!ChangeMe!UnioMercureJwtDevSecret32!'
    app.chat_mercure_topic_base_default: 'https://localhost/chat'
    app.pos_op_mercure_topic_base_default: 'https://localhost/pos-operatorio'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Service\PasswordResetService:
        arguments:
            $mailerFrom: '%app.mailer_from%'
            $mailerDsn: '%env(MAILER_DSN)%'
            $kernelDebug: '%kernel.debug%'

    App\Service\PlatformConfigService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\FuncionarioService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\UserProfileService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\RhDocumentService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ChatService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\ChatMercureTopics:
        arguments:
            $topicBase: '%env(default:app.chat_mercure_topic_base_default:MERCURE_CHAT_TOPIC_BASE)%'

    App\Service\PosOperatorio\PosOperatorioMercureTopics:
        arguments:
            $topicBase: '%env(default:app.pos_op_mercure_topic_base_default:POS_OP_MERCURE_TOPIC_BASE)%'

    App\Service\Ti\TiChamadoAttachmentService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Rh\RhCandidatoAttachmentService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Service\Rh\RhRecrutamentoEmailService:
        arguments:
            $mailerFrom: '%app.mailer_from%'

    App\Service\LgpdRequestMailer:
        arguments:
            $mailerFrom: '%app.mailer_from%'

    App\Controller\Module\Admin\AdminController:
        arguments:
            $passwordHasher: '@security.user_password_hasher'

    App\Service\Vitoria\VitoriaClient:
        arguments:
            $enabled: '%env(bool:default:vitoria_ai_enabled_default:VITORIA_AI_ENABLED)%'
            $baseUrl: '%env(default:vitoria_ai_url_default:VITORIA_AI_URL)%'
            $apiKey: '%env(default:vitoria_ai_key_default:VITORIA_AI_KEY)%'

    App\Command\VitoriaSmokeTestCommand:
        arguments:
            $defaultUri: '%env(default:default_uri_default:DEFAULT_URI)%'

    App\Command\SeedUsersCommand:
        arguments:
            $appEnv: '%kernel.environment%'

    App\Command\EnsurePlatformOwnerCommand:
        arguments:
            $appEnv: '%kernel.environment%'

    App\Service\PlatformOpsService:
        arguments:
            $appEnv: '%kernel.environment%'
            $mercureUrl: '%env(default:mercure_url_default:MERCURE_URL)%'
            $mercurePublicUrl: '%env(default:mercure_url_default:MERCURE_PUBLIC_URL)%'

    App\Service\Platform\PlatformCommandCenterService:
        arguments:
            $defaultUri: '%env(default:default_uri_default:DEFAULT_URI)%'

    App\Command\SeedProductGrantsCommand:
        arguments:
            $appEnv: '%kernel.environment%'

    App\Command\SeedDevProjetosCommand:
        arguments:
            $appEnv: '%kernel.environment%'

    App\Command\SeedRhProcessesCommand:
        arguments:
            $appEnv: '%kernel.environment%'

    App\Command\PosOperatorioSeedCommand:
        arguments:
            $appEnv: '%kernel.environment%'

    App\Service\Organismo\OrganismoFeature:
        arguments:
            $enabled: '%env(bool:default:unio.organismo.enabled_default:UNIO_ORGANISMO_ENABLED)%'
            $pulsoAsHome: '%env(bool:default:unio.organismo.pulso_home_default:UNIO_ORGANISMO_PULSO_HOME)%'

    App\Service\Vitoria\VitoriaToolRegistry:
        arguments:
            $tools: !tagged_iterator app.vitoria_tool

    App\Service\Vitoria\Tool\BuscarMembroTool:
        tags: ['app.vitoria_tool']

    App\Service\Vitoria\Tool\FeriasPendentesTool:
        tags: ['app.vitoria_tool']

    App\Service\Vitoria\Tool\AbrirAdmissaoTool:
        tags: ['app.vitoria_tool']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
