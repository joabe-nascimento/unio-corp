            $pulsoInProgress: '%env(default:unio.organismo.pulso_in_progress_default:UNIO_ORGANISMO_PULSO_IN_PROGRESS)%'
            $pulsoCasesHeading: '%env(default:unio.organismo.pulso_cases_heading_default:UNIO_ORGANISMO_PULSO_CASES_HEADING)%'
            $pulsoKpisHeading: '%env(default:unio.organismo.pulso_kpis_heading_default:UNIO_ORGANISMO_PULSO_KPIS_HEADING)%'
            $pulsoEmpty: '%env(default:unio.organismo.pulso_empty_default:UNIO_ORGANISMO_PULSO_EMPTY)%'
