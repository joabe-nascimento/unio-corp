    App\Service\Security\DefaultUserPasswordProvider:
        arguments:
            $defaultPassword: '%env(default:app.default_user_password_default:APP_DEFAULT_USER_PASSWORD)%'

    App\Command\SeedUsersCommand:
        arguments:
