# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    session:
        cookie_secure: auto
        cookie_samesite: lax
        cookie_httponly: true
        # Sem "lembrar-me": sessão expira após 30 min de inatividade
        gc_maxlifetime: 1800
        # cookie_lifetime: 0 — cookie de sessão (some ao fechar o browser)
        cookie_lifetime: 0
        gc_probability: 1
        gc_divisor: 100

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
