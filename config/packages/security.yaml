security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_MEMBRO:            ROLE_USER
        ROLE_SUPERVISOR_EQUIPE: ROLE_MEMBRO
        ROLE_SUPERVISOR:        ROLE_SUPERVISOR_EQUIPE
        ROLE_GESTOR_EQUIPE:     ROLE_SUPERVISOR
        ROLE_GESTOR:            ROLE_GESTOR_EQUIPE
        ROLE_TENANT:            ROLE_GESTOR

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|uploads)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\AppUserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_workspace_select
                username_parameter: email
                password_parameter: password
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800

    access_control:
        - { path: ^/$,                roles: PUBLIC_ACCESS }
        - { path: ^/login,              roles: PUBLIC_ACCESS }
        - { path: ^/logout,             roles: PUBLIC_ACCESS }
        - { path: ^/encerrar-sessao,    roles: PUBLIC_ACCESS }
        - { path: ^/register,           roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password,    roles: PUBLIC_ACCESS }
        - { path: ^/reset-password,     roles: PUBLIC_ACCESS }
        - { path: ^/manutencao,         roles: PUBLIC_ACCESS }
        - { path: ^/apresentacao,        roles: PUBLIC_ACCESS }
        - { path: ^/carreiras,            roles: PUBLIC_ACCESS }
        - { path: ^/instagram,           roles: PUBLIC_ACCESS }
        - { path: ^/dashboard,   roles: ROLE_USER }
        - { path: ^/hub/operacoes, roles: ROLE_USER }
        - { path: ^/rh,            roles: ROLE_USER }
        - { path: ^/pessoas,       roles: ROLE_USER }
        - { path: ^/talentos,    roles: ROLE_USER }
        - { path: ^/maturidade,  roles: ROLE_USER }
        - { path: ^/comercial,   roles: ROLE_USER }
        - { path: ^/beneficios,  roles: ROLE_USER }
        - { path: ^/academy,     roles: ROLE_USER }
        - { path: ^/parceiros,   roles: ROLE_USER }
        - { path: ^/financeiro,  roles: ROLE_USER }
        - { path: ^/compliance,  roles: ROLE_USER }
        - { path: ^/analytics,   roles: ROLE_USER }
        - { path: ^/juridico,    roles: ROLE_USER }
        - { path: ^/clima,       roles: ROLE_USER }
        - { path: ^/sst,         roles: ROLE_USER }
        - { path: ^/comunicacao, roles: ROLE_USER }
        - { path: ^/engenharia,  roles: ROLE_USER }
        - { path: ^/publicidade, roles: ROLE_USER }
        - { path: ^/admin,       roles: ROLE_TENANT }
        - { path: ^/,            roles: ROLE_USER }
