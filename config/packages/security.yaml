security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        ROLE_MEMBRO:            ROLE_USER
        ROLE_SUPERVISOR_EQUIPE: ROLE_MEMBRO
        ROLE_SUPERVISOR:        ROLE_SUPERVISOR_EQUIPE
        ROLE_GESTOR_EQUIPE:     ROLE_SUPERVISOR
        ROLE_GESTOR:            ROLE_GESTOR_EQUIPE
        ROLE_ADMIN:             ROLE_GESTOR
        ROLE_TENANT:            ROLE_ADMIN

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
                username_parameter: email
                password_parameter: password
            logout:
                path: app_logout
                target: app_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800

    access_control:
        - { path: ^/login,       roles: PUBLIC_ACCESS }
        - { path: ^/dashboard,   roles: ROLE_USER }
        - { path: ^/rh,          roles: ROLE_SUPERVISOR_EQUIPE }
        - { path: ^/pessoas,     roles: ROLE_SUPERVISOR_EQUIPE }
        - { path: ^/talentos,    roles: ROLE_GESTOR_EQUIPE }
        - { path: ^/maturidade,  roles: ROLE_GESTOR_EQUIPE }
        - { path: ^/admin,       roles: ROLE_ADMIN }
        - { path: ^/tenant,      roles: ROLE_TENANT }
        - { path: ^/,            roles: ROLE_USER }
