; Configuração PHP para o servidor local Symfony (symfony serve).
; Reinicie o servidor após alterar este arquivo.
;
; O Symfony CLI injeta este arquivo como ini extra no php-cgi. Sem as linhas
; abaixo, o worker web NÃO herda as extensões do php.ini global do Scoop
; (pdo_mysql, intl, etc.) e o app retorna "could not find driver".
;
; Symfony CLI usa o pacote php82 do Scoop (não o shim "php").
; Ajuste extension_dir se o PHP não estiver instalado via Scoop neste caminho:
extension_dir = "C:/Users/joabe/scoop/apps/php82/current/ext"
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=pdo_sqlite
extension=sodium
extension=zip

max_execution_time = 180
max_input_time = 120
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 48M
max_file_uploads = 20
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
