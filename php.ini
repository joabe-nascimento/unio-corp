; Configuração PHP para o servidor local Symfony (symfony serve).
; Reinicie o servidor após alterar este arquivo.
;
; Extensões PHP (pdo_mysql, intl, etc.) vêm do php.ini global do Scoop.
; Ajuste extension_dir apenas se o Symfony não encontrar as DLLs:
; extension_dir = "C:/Users/SEU_USUARIO/scoop/apps/php/current/ext"

max_execution_time = 180
max_input_time = 120
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 48M
max_file_uploads = 20
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
