; Configuração PHP para o servidor local Symfony (symfony serve).
; Reinicie o servidor após alterar este arquivo.
;
; O Symfony CLI injeta este arquivo como ini extra no php-cgi. Sem as linhas
; abaixo, o worker web NÃO herda as extensões do php.ini global do Scoop
; (pdo_mysql, intl, etc.) e o app retorna "could not find driver".
;
; Caminhos absolutos evitam conflito com extension_dir legado (ex.: php82).
extension=C:/Users/joabe/scoop/apps/php/current/ext/php_curl.dll
extension=C:/Users/joabe/scoop/apps/php/current/ext/php_fileinfo.dll
extension=C:/Users/joabe/scoop/apps/php/current/ext/php_gd.dll
extension=C:/Users/joabe/scoop/apps/php/current/ext/php_intl.dll
extension=C:/Users/joabe/scoop/apps/php/current/ext/php_mbstring.dll
extension=C:/Users/joabe/scoop/apps/php/current/ext/php_openssl.dll
extension=C:/Users/joabe/scoop/apps/php/current/ext/php_pdo_mysql.dll
extension=C:/Users/joabe/scoop/apps/php/current/ext/php_pdo_sqlite.dll
extension=C:/Users/joabe/scoop/apps/php/current/ext/php_sodium.dll
extension=C:/Users/joabe/scoop/apps/php/current/ext/php_zip.dll

max_execution_time = 180
max_input_time = 120
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 48M
max_file_uploads = 20
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Sem isso o Symfony HttpClient não usa o CurlHttpClient (cai para o
; NativeHttpClient via fopen(), que falha silenciosamente em respostas
; demoradas/grandes do LLM — "HTTP request failed!" mesmo com 200 OK real).
curl.cainfo = "C:/Users/joabe/scoop/apps/postgresql16/16.14/pgAdmin 4/python/Lib/site-packages/certifi/cacert.pem"
openssl.cafile = "C:/Users/joabe/scoop/apps/postgresql16/16.14/pgAdmin 4/python/Lib/site-packages/certifi/cacert.pem"

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
