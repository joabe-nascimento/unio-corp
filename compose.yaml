# Unio usa MariaDB/MySQL externo (ex.: container mariadb na porta 3308).
# Configure DATABASE_URL no .env.local — este projeto não usa PostgreSQL.
#
# Mercure (tempo real no kanban): docker compose up -d mercure
# Hub em http://localhost:3000 — variáveis MERCURE_* no .env

services:
###> symfony/mercure-bundle ###
    mercure:
        image: dunglas/mercure
        restart: unless-stopped
        environment:
            SERVER_NAME: ':3000'
            MERCURE_PUBLISHER_JWT_KEY: '${MERCURE_JWT_SECRET:-changeme}'
            MERCURE_SUBSCRIBER_JWT_KEY: '${MERCURE_JWT_SECRET:-changeme}'
            MERCURE_EXTRA_DIRECTIVES: |
                cors_origins http://127.0.0.1:8000 http://localhost:8000
        ports:
            - '3000:3000'
###< symfony/mercure-bundle ###

###> symfony/cache ###
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
###< symfony/cache ###

volumes:
    redis_data:

