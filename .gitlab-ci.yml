# GitLab CI — espelho do pipeline GitHub (validate → deploy → smoke).
# Variaveis: Settings → CI/CD → Variables (ver docs/GITLAB_SETUP.md)
# Deploy automatico so com UNIO_GITLAB_DEPLOY=1 (evita deploy duplo com GitHub Actions).

stages:
  - validate
  - deploy
  - smoke

variables:
  FF_USE_FASTZIP: "true"
  GIT_DEPTH: "0"

.default_php:
  image: php:8.2-cli
  before_script:
    - bash .gitlab/ci/install-ci-deps.sh

validate:
  extends: .default_php
  stage: validate
  services:
    - name: mariadb:10.11
      alias: mariadb
  variables:
    APP_ENV: dev
    APP_SECRET: ci-secret-not-for-production
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: unio
    DATABASE_URL: mysql://root:root@mariadb:3306/unio?serverVersion=mariadb-10.11.11&charset=utf8mb4
  script:
    - composer install --no-progress --prefer-dist --optimize-autoloader
    - npm ci
    - npm run vendor:sync
    - export GIT_BRANCH="${CI_COMMIT_REF_NAME}"
    - composer validate:ci
  artifacts:
    when: on_failure
    paths:
      - var/log/ci-failure-report.txt
    expire_in: 14 days
  rules:
    - if: $CI_COMMIT_BRANCH == "production" || $CI_COMMIT_BRANCH == "new_staging"

.deploy_template:
  extends: .default_php
  stage: deploy
  needs: [validate]
  script:
    - bash .gitlab/ci/deploy-hostgator.sh
  artifacts:
    when: always
    paths:
      - deploy-reports/deploy-report.txt
    expire_in: 14 days

deploy_staging:
  extends: .deploy_template
  environment:
    name: staging
    url: https://staging.uniowork.com.br
  variables:
    DEPLOY_PATH: /home2/joabef36/unio-staging
    DEPLOY_PUBLIC_HTML: /home2/joabef36/staging.uniowork.com.br
    ARCHIVE_REMOTE: deploy-staging.tar.gz
    SKIP_UNIO_PLATFORM_STEPS: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == "new_staging" && $UNIO_GITLAB_DEPLOY == "1"

deploy_production:
  extends: .deploy_template
  environment:
    name: production
    url: https://uniowork.com.br
  variables:
    DEPLOY_PATH: /home2/joabef36/unio
    DEPLOY_PUBLIC_HTML: /home2/joabef36/public_html
    ARCHIVE_REMOTE: deploy.tar.gz
    SKIP_UNIO_PLATFORM_STEPS: "0"
  rules:
    - if: $CI_COMMIT_BRANCH == "production" && $UNIO_GITLAB_DEPLOY == "1"
  when: manual
  allow_failure: false

.smoke_template:
  stage: smoke
  image: curlimages/curl:8.11.1
  script:
    - sh .gitlab/ci/smoke-http.sh

smoke_staging:
  extends: .smoke_template
  needs: [deploy_staging]
  variables:
    SMOKE_URLS: |
      https://staging.uniowork.com.br/
      https://staging.uniowork.com.br/login
      https://staging.uniowork.com.br/termos
      https://staging.uniowork.com.br/privacidade
  rules:
    - if: $CI_COMMIT_BRANCH == "new_staging" && $UNIO_GITLAB_DEPLOY == "1"

smoke_production:
  extends: .smoke_template
  needs: [deploy_production]
  variables:
    SMOKE_URLS: |
      https://uniowork.com.br/
      https://uniowork.com.br/login
      https://uniowork.com.br/termos
      https://uniowork.com.br/privacidade
  rules:
    - if: $CI_COMMIT_BRANCH == "production" && $UNIO_GITLAB_DEPLOY == "1"
